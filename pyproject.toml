[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "star-game-automation"
version = "0.1.0"
description = "A small port-and-adapter game automation demo."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "opencv-python-headless>=4.13.0",
    "pillow>=12.0",
    "pyautogui>=0.9.54",
]

[project.optional-dependencies]
macos = [
    "pyobjc-framework-ScreenCaptureKit>=12.1; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch>=12.1; sys_platform == 'darwin'",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.17.5",
]

[project.scripts]
star = "game_automation.platform.local_desktop.entrypoints.cli:main"
star-lab = "star_visual_lab.server:main"

[project.gui-scripts]
star-desktop = "game_automation.platform.local_desktop.entrypoints.desktop_app:main"

[tool.setuptools.package-data]
"star_visual_lab" = ["static/*", "static/images/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # 基础语法与代码错误
    "F",               # 未使用导入、未定义名称等
    "I",               # 导入排序
    "UP",              # Python 新版本写法
    "B",               # 常见易错写法
]

[tool.coverage.run]
branch = true
source = ["game_automation"]

[tool.coverage.report]
show_missing = true
skip_covered = true
