<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star 控制台</title>
  <link rel="stylesheet" href="/static/control.css">
</head>
<body>
  <main>
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>STAR</span></div>
      <span class="connection" id="connection-status" role="status">正在连接</span>
    </header>
    <section class="intro">
      <p class="eyebrow">本地脚本控制台</p>
      <h1>选好脚本，开始运行。</h1>
      <p class="subtitle">查看步骤，先模拟一次，再交给 Star 执行。</p>
      <p class="workspace" id="workspace-path">正在读取工作区…</p>
    </section>
    <section class="control-card" aria-label="脚本控制">
      <div class="control-heading"><span>运行脚本</span><span class="mode-badge" id="run-mode">模拟模式</span></div>
      <div class="toolbar">
        <label class="script-field" for="script-select">脚本<select id="script-select" disabled><option value="">正在读取脚本…</option></select></label>
        <button id="run-script" type="button" disabled>运行脚本 <span aria-hidden="true">↗</span></button>
        <button class="secondary" id="stop-script" type="button" disabled>停止</button>
      </div>
      <div class="mode-row">
        <label class="checkbox-label"><input id="dry-run-enabled" type="checkbox" checked disabled>模拟运行</label>
        <p id="mode-description">只输出计划动作；图片依赖在模拟中视为已找到。</p>
      </div>
      <details class="simulation-settings" id="simulation-settings">
        <summary>模拟设置</summary>
        <div class="settings-grid">
          <label for="dry-run-color">模拟颜色<input id="dry-run-color" value="#000000" pattern="#[0-9A-Fa-f]{6}" maxlength="7" required spellcheck="false"></label>
          <label for="dry-run-screen-state">模拟状态<input id="dry-run-screen-state" value="未知" list="screen-state-suggestions"><datalist id="screen-state-suggestions"></datalist></label>
        </div>
      </details>
      <p class="notice" id="script-config-errors" role="alert" hidden></p>
    </section>
    <section class="output-panel" aria-label="运行结果">
      <div class="output-heading"><h2>运行记录</h2><span class="run-status" id="status" role="status">正在同步运行状态…</span></div>
      <p class="notice" id="connection-error" role="alert" hidden></p>
      <pre id="output" tabindex="0" aria-label="脚本输出">还没有运行记录。</pre>
    </section>
    <details class="script-details-panel">
      <summary>脚本步骤与依赖</summary>
      <pre id="script-details">正在读取脚本详情…</pre>
    </details>
    <footer>Star · 桌面自动化，从一个可靠的脚本开始。</footer>
  </main>
  <script src="/static/control.js"></script>
</body>
</html>
